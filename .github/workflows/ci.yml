name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax check
        run: python -m compileall -q src
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: CLI smoke
        run: |
          PYTHONPATH=src python -m pathlab gen grid --rows 4 --cols 4 -o /tmp/g.json
          PYTHONPATH=src python -m pathlab trace /tmp/g.json --algo dijkstra | head -3
          PYTHONPATH=src python -m pathlab --help